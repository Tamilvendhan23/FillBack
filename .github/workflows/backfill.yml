
name: MyGit Streak Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First past date (YYYY-MM-DD)"
        required: true
        type: string

      end_date:
        description: "Last past date (YYYY-MM-DD)"
        required: true
        type: string

      author_email:
        description: "Verified email associated with your GitHub account"
        required: true
        type: string

      commits_per_day:
        description: "Number of labelled records per date (1-5)"
        required: true
        type: number
        default: 1

      confirm_backfill:
        description: "Confirm creation of labelled backfill records"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mygit-streak-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ inputs.confirm_backfill }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate and create records
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          AUTHOR_EMAIL: ${{ inputs.author_email }}
          COMMITS_PER_DAY: ${{ inputs.commits_per_day }}
          CONFIRM_BACKFILL: ${{ inputs.confirm_backfill }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/backfill.py

      - name: Push to default branch
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

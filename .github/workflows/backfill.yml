
name: MyGit Streak Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First past date (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "Last past date (YYYY-MM-DD)"
        required: true
        type: string
      author_email:
        description: "Verified email linked to your GitHub account"
        required: true
        type: string
      confirm_backfill:
        description: "Confirm creation of labelled backfill records"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mygit-streak-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ inputs.confirm_backfill }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and create records
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          AUTHOR_EMAIL: ${{ inputs.author_email }}
          CONFIRM_BACKFILL: ${{ inputs.confirm_backfill }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: python .github/scripts/backfill.py

      - name: Push records to default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
